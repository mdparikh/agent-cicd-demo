name: Agent CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read


jobs:

  # ==========================================================
  # CONTINUOUS INTEGRATION
  # ==========================================================

  ci:
    name: Agent CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------
      # Python
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # -------------------------
      # Unit tests
      # -------------------------

      - name: Run pytest
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m pytest -q

      # -------------------------
      # Node / Promptfoo
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: |
          npm install

      # -------------------------
      # Promptfoo evaluation
      # -------------------------

      - name: Run Promptfoo evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          npx promptfoo@latest eval \
            -c promptfooconfig.yaml \
            -o promptfoo-results.json \
            -o promptfoo-report.html

      # -------------------------
      # LLM quality gate
      # -------------------------

      - name: Run LLM quality gate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python eval_agent.py

      # -------------------------
      # Evaluation artifacts
      # -------------------------

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-results
          path: |
            promptfoo-results.json
            promptfoo-report.html


  # ==========================================================
  # CONTINUOUS DEPLOYMENT
  # ==========================================================

  cd:
    name: Deploy to Hugging Face Spaces

    # CD cannot start unless ALL CI steps pass
    needs: ci

    # Deploy only on push to main.
    # Pull requests run CI but do not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------
      # Deploy to Hugging Face
      # -------------------------

      - name: Deploy to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: leadingedge9/customer-support-agent
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: gradio